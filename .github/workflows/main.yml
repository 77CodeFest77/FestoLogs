name: Auto Joiner 24/7 Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: |
          pip uninstall discord discord.py discord.py-self -y 2>/dev/null || true
          pip install --force-reinstall --no-cache-dir discord.py-self requests
          echo "========== Installed packages =========="
          pip list | grep -i discord
          echo "========================================"
          python -c "import discord_self; print('discord_self found:', discord_self.__version__)" || echo "discord_self NOT found"
      
      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > bot.py << 'EOF'
          import os, time, requests
          
          # Пробуем discord_self (правильный модуль self-бота)
          try:
              import discord_self as discord
              print("✅ Using discord_self")
          except ImportError:
              import discord
              print("⚠️ Using discord (may not work)")

          TOKEN = os.environ["DISCORD_USER_TOKEN"]
          CHANNEL_ID = int(os.environ["DISCORD_CHANNEL_ID"])
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"]

          # Настройка интентов (есть в discord_self)
          try:
              intents = discord.Intents.default()
              intents.message_content = True
              intents.guilds = True
              intents.messages = True
          except AttributeError:
              # Если Intents нет, создаём клиент без них
              intents = None

          class SelfBot(discord.Client):
              def __init__(self):
                  if intents:
                      super().__init__(intents=intents)
                  else:
                      super().__init__()

              async def on_ready(self):
                  print(f'ONLINE as {self.user}')
                  channel = self.get_channel(CHANNEL_ID)
                  if channel:
                      print(f'Monitoring: #{channel.name} in {channel.guild.name}')
                  else:
                      print(f'CHANNEL NOT FOUND! ID: {CHANNEL_ID}')

              async def on_message(self, msg):
                  if msg.channel.id != CHANNEL_ID or msg.author == self.user:
                      return
                  print(f'MSG: {msg.author}: {msg.content}')
                  try:
                      r = requests.post(WEBHOOK_URL, json={
                          "content": msg.content,
                          "username": str(msg.author),
                          "avatar_url": str(msg.author.avatar.url) if msg.author.avatar else None
                      })
                      print(f'Webhook: {r.status_code}')
                  except Exception as e:
                      print(f'Webhook error: {e}')

          bot = SelfBot()
          while True:
              try:
                  bot.run(TOKEN)
              except Exception as e:
                  print(f'ERROR: {e}')
                  time.sleep(10)
          EOF
          python bot.py
