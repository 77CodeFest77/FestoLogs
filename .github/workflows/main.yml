name: Auto Joiner 24/7 Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: |
          pip uninstall discord discord.py discord.py-self -y 2>/dev/null || true
          pip install --force-reinstall --no-cache-dir discord.py-self requests
      
      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > bot.py << 'EOF'
          import os, time, requests
          
          # Пробуем discord_self, если нет — обычный discord
          try:
              import discord_self as discord
              print("✅ Использую discord_self")
          except ImportError:
              import discord
              print("⚠️ Использую обычный discord")
          
          TOKEN = os.environ["DISCORD_USER_TOKEN"]
          CHANNEL_ID = int(os.environ["DISCORD_CHANNEL_ID"])
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"]
          print(f"Целевой канал ID: {CHANNEL_ID}")
          print(f"Webhook URL: {WEBHOOK_URL[:50]}...")  # первые 50 символов для проверки
          
          try:
              intents = discord.Intents.default()
              intents.message_content = True
              intents.guilds = True
              intents.messages = True
          except AttributeError:
              intents = None
          
          class SelfBot(discord.Client):
              def __init__(self):
                  if intents:
                      super().__init__(intents=intents)
                  else:
                      super().__init__()
          
              async def on_ready(self):
                  print(f'ONLINE as {self.user}')
                  channel = self.get_channel(CHANNEL_ID)
                  if channel:
                      print(f'Мониторю канал: #{channel.name} на сервере {channel.guild.name}')
                  else:
                      print(f'КАНАЛ НЕ НАЙДЕН! Проверь ID: {CHANNEL_ID}')
          
              async def on_message(self, msg):
                  # Диагностика: показываем ВСЕ сообщения, которые видит бот
                  print(f'DEBUG: Канал {msg.channel.id} | Автор ID {msg.author.id} | Бот ID {self.user.id}')
                  print(f'DEBUG: Сообщение: {msg.content}')
                  
                  # Проверяем только канал, автора не фильтруем (может глючить)
                  if msg.channel.id != CHANNEL_ID:
                      print(f'DEBUG: Пропускаю (не тот канал)')
                      return
                  
                  print(f'>>>> ПЕРЕСЫЛАЮ: {msg.author}: {msg.content}')
                  try:
                      # Отправляем без аватарки, чтобы исключить ошибку с ней
                      payload = {
                          "content": msg.content,
                          "username": str(msg.author)
                      }
                      r = requests.post(WEBHOOK_URL, json=payload)
                      print(f'Webhook ответ: {r.status_code} {r.text}')
                  except Exception as e:
                      print(f'Webhook ошибка: {e}')
          
          bot = SelfBot()
          while True:
              try:
                  bot.run(TOKEN)
              except Exception as e:
                  print(f'ERROR: {e}')
                  time.sleep(10)
          EOF
          python bot.py
