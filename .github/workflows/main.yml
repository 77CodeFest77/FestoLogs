name: Auto Joiner 24/7 Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: |
          pip uninstall discord.py -y 2>/dev/null
          pip install discord.py-self requests
      
      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > bot.py << 'EOF'
          import discord
          import requests
          import os
          import time

          TOKEN = os.environ["DISCORD_USER_TOKEN"]
          CHANNEL_ID = int(os.environ["DISCORD_CHANNEL_ID"])
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"]

          intents = discord.Intents.default()
          intents.message_content = True
          intents.guilds = True
          intents.messages = True

          class SelfBot(discord.Client):
              def __init__(self):
                  super().__init__(intents=intents)

              async def on_ready(self):
                  print(f'ONLINE as {self.user}')
                  channel = self.get_channel(CHANNEL_ID)
                  if channel:
                      print(f'Monitoring: #{channel.name} in {channel.guild.name}')
                  else:
                      print(f'CHANNEL NOT FOUND! Check ID: {CHANNEL_ID}')

              async def on_message(self, msg):
                  if msg.channel.id != CHANNEL_ID:
                      return
                  if msg.author == self.user:
                      return
                  
                  print(f'MSG: {msg.author}: {msg.content}')
                  
                  try:
                      r = requests.post(WEBHOOK_URL, json={
                          "content": msg.content,
                          "username": str(msg.author),
                          "avatar_url": str(msg.author.avatar.url) if msg.author.avatar else None
                      })
                      print(f'Webhook response: {r.status_code}')
                  except Exception as e:
                      print(f'Webhook error: {e}')

          bot = SelfBot()
          while True:
              try:
                  bot.run(TOKEN)
              except Exception as e:
                  print(f'ERROR: {e}')
                  time.sleep(10)
          EOF
          python bot.py
