name: Auto Joiner 24/7 Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: |
          pip uninstall discord discord.py discord.py-self -y 2>/dev/null || true
          pip install --force-reinstall --no-cache-dir discord.py-self requests
      
      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > bot.py << 'EOF'
          import os, time, requests
          try:
              import discord_self as discord
          except ImportError:
              import discord

          TOKEN = os.environ["DISCORD_USER_TOKEN"].strip()
          # Жёстко чистим CHANNEL_ID от пробелов и кавычек
          raw_channel_id = os.environ["DISCORD_CHANNEL_ID"].strip().strip('"').strip("'")
          CHANNEL_ID = int(raw_channel_id)
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"].strip()

          print(f"🔧 Запускаюсь с CHANNEL_ID={CHANNEL_ID}")

          # Интенты (если есть)
          try:
              intents = discord.Intents.default()
              intents.message_content = True
              intents.guilds = True
              intents.messages = True
          except AttributeError:
              intents = None

          class SelfBot(discord.Client):
              def __init__(self):
                  if intents:
                      super().__init__(intents=intents)
                  else:
                      super().__init__()

              async def on_ready(self):
                  print(f'✅ Онлайн как {self.user}')
                  ch = self.get_channel(CHANNEL_ID)
                  if ch:
                      print(f'📡 Найден канал #{ch.name} ({ch.id})')
                  else:
                      print(f'❌ Канал с ID {CHANNEL_ID} не найден!')

              async def on_message(self, msg):
                  # Явное сравнение, убираем свои сообщения
                  if int(msg.channel.id) != CHANNEL_ID:
                      return
                  if msg.author.id == self.user.id:
                      return
                  
                  print(f'📨 {msg.author}: {msg.content}')
                  
                  # Отправка в вебхук
                  try:
                      payload = {
                          "content": msg.content,
                          "username": str(msg.author)
                      }
                      r = requests.post(WEBHOOK_URL, json=payload)
                      print(f'   -> Webhook: {r.status_code}')
                  except Exception as e:
                      print(f'   -> Webhook ошибка: {e}')

          bot = SelfBot()
          while True:
              try:
                  bot.run(TOKEN)
              except Exception as e:
                  print(f'💥 Крах: {e}')
                  time.sleep(10)
          EOF
          python bot.py
