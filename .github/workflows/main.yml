name: Auto Joiner 24/7 Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip uninstall discord discord.py discord.py-self discord_self -y 2>/dev/null || true
          pip install --no-cache-dir discord.py-self requests

      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > bot.py << 'EOF'
          import os
          import sys
          import time
          import asyncio
          import requests

          try:
              import discord_self as discord
          except ImportError:
              import discord

          TOKEN = os.environ["DISCORD_USER_TOKEN"].strip()
          raw_channel_id = os.environ["DISCORD_CHANNEL_ID"].strip()
          WEBHOOK_URL = os.environ["DISCORD_WEBHOOK_URL"].strip()

          raw_channel_id = raw_channel_id.strip().strip('"').strip("'")
          CHANNEL_ID = int(raw_channel_id)

          if not TOKEN or not WEBHOOK_URL or not CHANNEL_ID:
              print("❌ Не хватает секретов!")
              sys.exit(1)

          print(f"🔧 Запускаюсь. CHANNEL_ID={CHANNEL_ID}")

          # Интенты
          intents = discord.Intents.default()
          intents.message_content = True
          intents.guilds = True
          intents.messages = True

          class SelfBot(discord.Client):
              async def on_ready(self):
                  print(f"✅ Онлайн как: {self.user} (id={self.user.id})")
                  ch = self.get_channel(CHANNEL_ID)
                  if ch:
                      print(
                          f"📡 Канал найден: #{getattr(ch, 'name', '???')} ({ch.id})"
                      )
                  else:
                      print(f"❌ Канал с ID {CHANNEL_ID} не найден!")

              async def post_to_webhook(self, payload: dict):
                  try:
                      # Webhook обычно отвечает 204
                      r = await asyncio.to_thread(
                          requests.post, WEBHOOK_URL, json=payload, timeout=15
                      )
                      print(f"   -> Webhook: {r.status_code}")
                  except Exception as e:
                      print(f"   -> Webhook ошибка: {e}")

              async def on_message(self, msg):
                  try:
                      # 1) Фильтр по каналу
                      msg_channel_id = int(msg.channel.id)
                      if msg_channel_id != CHANNEL_ID:
                          return

                      # 2) Не форвардим свои сообщения
                      if msg.author and msg.author.id == self.user.id:
                          return

                      content = (msg.content or "").strip()
                      if not content:
                          return

                      # лимит для безопасности
                      if len(content) > 1900:
                          content = content[:1900] + "…"

                      print(f"📨 {msg.author} ({msg.author.id}): {content}")

                      payload = {
                          "content": f"📨 **{msg.author}**: {content}",
                          "username": "Auto Joiner Logger",
                      }

                      await self.post_to_webhook(payload)
                  except Exception as e:
                      print(f"⚠️ on_message error: {e}")

          bot = SelfBot(intents=intents)

          while True:
              try:
                  bot.run(TOKEN)
              except Exception as e:
                  print(f"💥 Крах: {e}")
                  time.sleep(10)
          EOF
          python bot.py
