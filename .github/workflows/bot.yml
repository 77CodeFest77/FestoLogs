name: Run FestoLogs Bot

on:
  schedule:
    # Запуск каждые 6 часов – даёт почти непрерывную работу с перезапуском
    - cron: '0 */6 * * *'
  workflow_dispatch:   # можно запустить вручную

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 часов – максимальное время одного запуска для публичных репозиториев

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip uninstall discord -y || true
          pip install discord.py requests

      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
        run: python bot.py
