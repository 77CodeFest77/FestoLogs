name: Discord Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip uninstall discord discord.py discord.py-self discord_self -y 2>/dev/null || true
          pip install --no-cache-dir discord.py-self requests

      - name: Run bot
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
        run: |
          cat > bot.py << 'EOF'
          import os
          import sys
          import time
          import asyncio
          import requests

          try:
              import discord_self as discord
          except ImportError:
              import discord


          # ====== ВСТАВЬ СЮДА СВОИ ЗНАЧЕНИЯ ======
          CHANNEL_ID = 123456789012345678  # <-- замени на ID ТВОЕГО КАНАЛА
          WEBHOOK_URL = "https://discord.com/api/webhooks/XXXX/YYY"  # <-- замени
          # ======================================


          TOKEN = os.environ.get("DISCORD_USER_TOKEN", "").strip()
          if not TOKEN:
              print("❌ DISCORD_USER_TOKEN не задан в secrets.")
              sys.exit(1)

          if not WEBHOOK_URL or WEBHOOK_URL.startswith("https://discord.com/api/webhooks/XXXX"):
              print("❌ WEBHOOK_URL не заменён в коде.")
              sys.exit(1)

          if not CHANNEL_ID:
              print("❌ CHANNEL_ID не задан в коде.")
              sys.exit(1)

          intents = discord.Intents.default()
          intents.message_content = True
          intents.guilds = True
          intents.messages = True


          class SelfBot(discord.Client):
              async def on_ready(self):
                  print(f"✅ Online as: {self.user} (id={self.user.id})")
                  ch = self.get_channel(CHANNEL_ID)
                  if ch:
                      print(
                          f"📡 Channel found: #{getattr(ch, 'name', '???')} ({ch.id})"
                      )
                  else:
                      print(f"❌ Channel with ID {CHANNEL_ID} not found in cache")

              async def post_to_webhook(self, payload: dict):
                  try:
                      r = await asyncio.to_thread(
                          requests.post, WEBHOOK_URL, json=payload, timeout=15
                      )
                      print(f"   -> Webhook: {r.status_code}")
                  except Exception as e:
                      print(f"   -> Webhook error: {e}")

              async def on_message(self, msg):
                  try:
                      # msg.channel нужен всегда, иначе фильтр по каналу упадёт
                      if not getattr(msg, "channel", None):
                          return

                      # фильтр: только нужный канал
                      if int(msg.channel.id) != int(CHANNEL_ID):
                          return

                      # не форвардим сообщения автора-бота (свой же self-bot)
                      if msg.author and self.user and msg.author.id == self.user.id:
                          return

                      content = (msg.content or "").strip()
                      if not content:
                          return

                      if len(content) > 1900:
                          content = content[:1900] + "…"

                      print(f"📨 {msg.author} ({msg.author.id}): {content}")

                      payload = {
                          "content": f"📨 **{msg.author}**: {content}",
                          "username": "Auto Joiner Logger",
                      }
                      await self.post_to_webhook(payload)
                  except Exception as e:
                      print(f"⚠️ on_message error: {e}")


          if __name__ == "__main__":
              bot = SelfBot(intents=intents)
              while True:
                  try:
                      bot.run(TOKEN)
                  except Exception as e:
                      print(f"💥 Crash: {e}")
                      time.sleep(10)
          EOF
          python bot.py
